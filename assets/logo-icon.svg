<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1422" />
      <stop offset="50%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Block Face Top -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Block Face Left -->
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Block Face Right -->
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="256" cy="256" r="140" fill="#F59E0B" opacity="0.12" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="90" fill="#06B6D4" opacity="0.15" filter="url(#subtleGlow)" />

  <!-- Outer Orbit Rings (Decentralized Network Concept) -->
  <g transform="translate(256, 256)">
    <!-- Rotating Ellipse Orbit 1 -->
    <ellipse cx="0" cy="0" rx="180" ry="72" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="14 8" opacity="0.45" transform="rotate(-28)" />
    <!-- Node on Orbit 1 -->
    <circle cx="158" cy="-84" r="7" fill="#FCD34D" filter="url(#glow)" />
    <circle cx="-158" cy="84" r="5" fill="#F59E0B" />

    <!-- Rotating Ellipse Orbit 2 -->
    <ellipse cx="0" cy="0" rx="180" ry="72" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.4" transform="rotate(32)" />
    <!-- Node on Orbit 2 -->
    <circle cx="-150" cy="-92" r="6" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="150" cy="92" r="5" fill="#06B6D4" />
  </g>

  <!-- Central Blockchain Hub Isometric Cube -->
  <g transform="translate(256, 230)">
    <!-- Top Face -->
    <polygon points="0,-82 92,-30 0,22 -92,-30" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="-92,-30 0,22 0,126 -92,74" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <polygon points="0,22 92,-30 92,74 0,126" fill="url(#cubeRight)" />

    <!-- High-tech Grid Lines on Top Face -->
    <line x1="0" y1="-82" x2="0" y2="22" stroke="#FEF3C7" stroke-width="2" stroke-opacity="0.6" />
    <line x1="-92" y1="-30" x2="92" y2="-30" stroke="#FEF3C7" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Inner Core Nexus (The Energy Hub) -->
    <g transform="translate(0, 16)">
      <!-- Central Cyan Diamond Core -->
      <polygon points="0,-36 32,-18 0,0 -32,-18" fill="#E0F2FE" opacity="0.9" filter="url(#glow)" />
      <!-- Vertical Pulse Energy Beam -->
      <path d="M-6,-22 L6,-22 L2,18 L-2,18 Z" fill="url(#cyanGrad)" />
      <polygon points="0,-14 16,-5 0,4 -16,-5" fill="#38BDF8" />
    </g>

    <!-- Tech Circuit Accent Dots on Front Faces -->
    <circle cx="-46" cy="22" r="4" fill="#FCD34D" opacity="0.8" />
    <line x1="-46" y1="22" x2="-20" y2="36" stroke="#FCD34D" stroke-width="1.5" opacity="0.5" />
    <circle cx="-20" cy="36" r="3" fill="#FCD34D" opacity="0.8" />

    <circle cx="46" cy="22" r="4" fill="#38BDF8" opacity="0.8" />
    <line x1="46" y1="22" x2="20" y2="36" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" />
    <circle cx="20" cy="36" r="3" fill="#38BDF8" opacity="0.8" />
  </g>

  <!-- Base Dynamic Lightning Emblem (Web3 Speed & Authority) -->
  <path d="M262,374 L244,408 L264,408 L250,446 L278,396 L258,396 Z" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
