<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1422" />
      <stop offset="50%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Filter -->
    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Container -->
  <rect width="840" height="220" rx="36" fill="url(#bgBanner)" />
  <rect width="836" height="216" x="2" y="2" rx="34" fill="none" stroke="url(#goldGradL)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Left Icon Mark (Scaled & Centered around (120, 110)) -->
  <g transform="translate(120, 110)">
    <!-- Ambient Glow -->
    <circle cx="0" cy="0" r="65" fill="#F59E0B" opacity="0.12" filter="url(#glowL)" />
    
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="80" ry="32" fill="none" stroke="url(#goldGradL)" stroke-width="2" stroke-dasharray="6 4" opacity="0.5" transform="rotate(-25)" />
    <circle cx="68" cy="-35" r="3.5" fill="#FCD34D" filter="url(#glowL)" />
    
    <ellipse cx="0" cy="0" rx="80" ry="32" fill="none" stroke="url(#cyanGradL)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" transform="rotate(35)" />
    <circle cx="-68" cy="-38" r="3" fill="#38BDF8" filter="url(#glowL)" />

    <!-- Isometric Blockchain Cube -->
    <g transform="translate(0, -12)">
      <!-- Top Face -->
      <polygon points="0,-40 44,-15 0,10 -44,-15" fill="#FCD34D" />
      <!-- Left Face -->
      <polygon points="-44,-15 0,10 0,60 -44,35" fill="#D97706" />
      <!-- Right Face -->
      <polygon points="0,10 44,-15 44,35 0,60" fill="#92400E" />
      
      <!-- Grid line -->
      <line x1="0" y1="-40" x2="0" y2="10" stroke="#FEF3C7" stroke-width="1.5" stroke-opacity="0.7" />
      <!-- Inner Diamond -->
      <polygon points="0,-16 16,-7 0,2 -16,-7" fill="#E0F2FE" filter="url(#glowL)" />
      <!-- Circuit dots -->
      <circle cx="-22" cy="10" r="2.5" fill="#FCD34D" />
      <circle cx="22" cy="10" r="2.5" fill="#38BDF8" />
    </g>

    <!-- Speed Lightning -->
    <path d="M4,55 L-4,70 L5,70 L-2,86 L10,64 L2,64 Z" fill="url(#goldGradL)" filter="url(#glowL)" />
  </g>

  <!-- Divider Line -->
  <line x1="225" y1="45" x2="225" y2="175" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Typography & Branding -->
  <g transform="translate(260, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 44)">
      <rect width="180" height="24" rx="6" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="16" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">⚡ WEB3 全景生态导航</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      <tspan fill="#FFFFFF">Crypto</tspan>
      <tspan fill="url(#goldGradL)">Hub</tspan>
    </text>

    <!-- Subtitle / English Tagline -->
    <text x="2" y="152" fill="#94A3B8" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="500" letter-spacing="2">
      THE OPEN-SOURCE CRYPTO &amp; WEB3 ECOSYSTEM DIRECTORY
    </text>

    <!-- Pinned Exchanges Callout Tag -->
    <g transform="translate(560, 44)">
      <rect width="112" height="24" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
      <text x="10" y="16" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🏆 交易所置顶</text>
    </g>
  </g>
</svg>
